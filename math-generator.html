<!DOCTYPE html>
<html lang="en">
<!-- Reload the page -->
<!-- <meta http-equiv="Refresh" content="1"/> -->

<head>
    <meta charset="UTF-8">
    <title>Math generator</title>
</head>

<body style="font-size: 6vw;">

    <div>
        <span id="expression" style="font-size: 20vw;"></span>
        <input id="answer" type="number" style="font-size: 20vw;">
        <span id="knowledge" style="font-size: 10vw;"></span>
    </div>
</body>
<script>
    let expression = document.getElementById("expression")
    let answer = document.getElementById("answer")
    let knowledgeElement = document.getElementById("knowledge")

    let expressionIndex
    let knowledge = []
    for (let left = 2; left <= 9; left++) {
        for (let right = 2; right <= 9; right++) {
            knowledge.push({
                left: left,
                right: right,
                // "demonstrated"
                state: "",
                lastResults: []
            })
        }
    }
    function expr() { return knowledge[expressionIndex] }

    let autoConfirmationTimeoutId = 0


    answer.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            onEnter()
        } else {
            if (expr().state === "incorrectAnswerAccepted") {
                answer.style.color = ""
            }
        }
    });

    selectNewExpression()

    function selectNewExpression() {
        if (knowledge.length == 0) {
            expression.textContent = "Win!"
            expression.style.color = "green"
        } else if (knowledge.length == 1) {
            expressionIndex = 0
        } else {
            let prevExpressionIndex = expressionIndex
            do {
                expressionIndex = random(0, Math.min(9, knowledge.length - 1))
            } while (expressionIndex == prevExpressionIndex)

            expression.textContent = `${expr().left} × ${expr().right} = `
            answer.value = ""
            answer.style.color = ""

            expr().state = "demonstrated"

            updateStats()
        }
    }

    function updateStats() {
        knowledgeElement.textContent = `${knowledge.length}/${knowledge.filter(e => e.lastResults.length > 0).length}`
    }

    function random(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1))
    }

    function pushAndKeepLast5(results, value) {
        results.push(value)
        if (results.length > 5) {
            results.splice(0, (results.length - 5))
        }
    }


    function onEnter() {
        if (answer.value == expr().left * expr().right) {
            //correct answer
            answer.style.color = "green"

            if (expr().state === "demonstrated") {
                //correct answer from the first attempt
                expr().state = "correctAnswerEntered"
                pushAndKeepLast5(expr().lastResults, true)
                //keep the green result
                scheduleAutoConfirmation()
            }
            else if (expr().state === "incorrectAnswerAccepted") {
                expr().state = "correctAnswerEntered"
                //keep the green result
                scheduleAutoConfirmation()
            }
            else if (expr().state === "correctAnswerEntered") {
                cancelAutoConfirmation()
                if (!expr().lastResults.includes(false)) {
                    // correct answer from the the first attempt
                    // or last 5 attempts are correct
                    knowledge.splice(expressionIndex, 1)
                }
                selectNewExpression()
            }

        } else {
            // incorrect answer
            answer.style.color = "red"

            if (expr().state === "demonstrated") {
                expr().state = "incorrectAnswerAccepted"
                pushAndKeepLast5(expr().lastResults, false)
            } else if (expr().state === "incorrectAnswerAccepted") {
                //do nothing until correct answer is provided
            }

        }
    }

    function cancelAutoConfirmation() {
        if (autoConfirmationTimeoutId != null) {
            clearTimeout(autoConfirmationTimeoutId)
            autoConfirmationTimeoutId = null
        }
    }
    function scheduleAutoConfirmation() {
        if (autoConfirmationTimeoutId != null) {
            clearTimeout(autoConfirmationTimeoutId)
            autoConfirmationTimeoutId = null
        }
        autoConfirmationTimeoutId = setTimeout(() => {
            onEnter()
        }, 750);
    }
</script>

</html>
